setupVersion: 3
theme:
  dark: onyx
  light: dark-poimandres
symbolPreset: nerd
defaultThinkingLevel: xhigh
hideThinkingBlock: true
memory:
  backend: mnemopi
mnemopi:
  polyphonicRecall: false
modelRoles:
  smol: openai-codex/gpt-6.1-sol:xhigh
  advisor: anthropic/claude-fable-5-1:xhigh
  task: openai-codex/gpt-6.1-sol:xhigh
  tiny: openai-codex/gpt-5.3-codex-spark:xhigh
  slow: openai-codex/gpt-6-luna:max
  web: web/parallel
  default: anthropic/claude-opus-5-5:xhigh
dev:
  autoqaConsent: granted
extensions:
  - omp/hooks/verification-recorder.ts
  - omp/hooks/retention-canary.ts
compaction:
  thresholdTokens: 150000
  idleEnabled: true
  handoffSaveToDisk: true
  methodOrder:
    - handoff
    - remote
    - soft
skills:
  enableClaudeUser: true
  enableAgentsUser: false
codexResets:
  autoRedeem: "no"
composer:
  shape: box
edit:
  mode: hashline
cycleOrder:
  - smol
  - default
  - slow
retry:
  fallbackChains:
    default:
      - anthropic/claude-opus-5-5:xhigh
    advisor:
      - openai-codex/gpt-6.1-sol
    task:
      - openai-codex/gpt-6.1-sol:xhigh
task:
  agentModelOverrides:
    reviewer: openai-codex/gpt-6.1-sol:max
    scout: openai-codex/gpt-6.1-sol:xhigh
    task: openai-codex/gpt-6.1-sol:xhigh
  disabledAgents: []
stt:
  enabled: true
update:
  auto: true
