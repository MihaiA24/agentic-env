services:
  fresh-install:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.agentic
    working_dir: /dotfiles/agentic-env
    command: ["/bin/sh", "./clean-acceptance.sh"]
    environment:
      AGENTIC_SMOKE_HOME: /home/node/acceptance
      SKIP_INSTALL: ${SKIP_INSTALL:-0}
      VERBOSE: ${VERBOSE:-0}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-local}
      GITHUB_RUN_ATTEMPT: ${GITHUB_RUN_ATTEMPT:-1}
      GITHUB_SHA: ${GITHUB_SHA:-}
    volumes:
      - ..:/dotfiles:ro

  fresh-install-arch:
    profiles: ["arch"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.arch
    working_dir: /dotfiles/agentic-env
    command: ["/bin/sh", "./clean-acceptance.sh"]
    environment:
      AGENTIC_SMOKE_HOME: /home/node/acceptance
      SKIP_INSTALL: ${SKIP_INSTALL:-0}
      VERBOSE: ${VERBOSE:-0}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-local}
      GITHUB_RUN_ATTEMPT: ${GITHUB_RUN_ATTEMPT:-1}
      GITHUB_SHA: ${GITHUB_SHA:-}
    volumes:
      - ..:/dotfiles:ro
