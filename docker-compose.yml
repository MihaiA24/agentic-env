services:
  fresh-install: &fresh-install
    platform: linux/amd64
    image: ${COMPOSE_PROJECT_NAME:-agentic-env}-debian-amd64
    build:
      context: .
      dockerfile: Dockerfile.agentic
    working_dir: /agentic-env
    command: ["/bin/sh", "./clean-acceptance.sh"]
    environment:
      AGENTIC_SMOKE_HOME: /home/node/acceptance
      SKIP_INSTALL: ${SKIP_INSTALL:-0}
      VERBOSE: ${VERBOSE:-0}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-local}
      GITHUB_RUN_ATTEMPT: ${GITHUB_RUN_ATTEMPT:-1}
      GITHUB_SHA: ${GITHUB_SHA:-}
    volumes:
      - .:/agentic-env:ro

  fresh-install-arch:
    <<: *fresh-install
    profiles: ["arch"]
    image: ${COMPOSE_PROJECT_NAME:-agentic-env}-arch-amd64
    build:
      context: .
      dockerfile: Dockerfile.arch
