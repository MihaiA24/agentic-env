[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-env"
version = "0.1.0"
description = "Install and maintain a local agentic tooling stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "questionary>=2.0", "rich>=13.7"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
agentic-install-agents = "agentic_env.install_agents:main"
agentic-install-skills-mcps = "agentic_env.install_skills_mcps:main"
agentic-configure-agent-mcps = "agentic_env.configure_agent_mcps:main"
agentic-bootstrap = "agentic_env.bootstrap:main"
agentic-update-stack = "agentic_env.update_agentic_stack:main"
agentic-stack-doctor = "agentic_env.stack_doctor:main"
agentic-skill-drift = "agentic_env.skill_drift:main"

[tool.hatch.build.targets.wheel]
packages = ["agentic_env"]
artifacts = [
  "agentic_env/skill-packs.json",
  "agentic_env/skill-fingerprints.json",
  "agentic_env/skill_bodies/*.md",
  "agentic_env/vendored/**",
]
